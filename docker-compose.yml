# JobGoblin — local/self-hosted stack.
# Services: db + ollama + backend (backend-foundation) and
# frontend + caddy reverse proxy (frontend-foundation).
# cloudflared (tunnel) is added in a later branch.
#
# Caddy is the single entry point on http://localhost:8080 — it routes
# /api/* to the backend and everything else to the Next.js frontend, so the
# browser always makes same-origin requests (clean session cookies, no CORS).
# The backend's port 8000 is still published for direct API access / docs.
name: jobgoblin

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobgoblin
      POSTGRES_PASSWORD: jobgoblin
      POSTGRES_DB: jobgoblin
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobgoblin"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    # GPU acceleration (NVIDIA RTX 4070) — requires the NVIDIA Container Toolkit
    # on the host. Uncomment to enable:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    # Shell-style defaults so values in .env take precedence; the defaults only
    # apply when a variable is unset.
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://jobgoblin:jobgoblin@db:5432/jobgoblin}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
    volumes:
      - uploads:/data/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  frontend:
    build: ./frontend
    # In production the browser talks to the frontend through Caddy on the
    # same origin, so the Next.js app calls the backend via the relative
    # "/api" prefix — no public API URL needed here.
    environment:
      NODE_ENV: production
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  ollama:
  caddy_data:
  caddy_config:
