name: Build, Verify & Publish

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5433/test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  e2e:
    name: Playwright E2E (Docker Compose + Caddy)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      E2E_ADMIN_EMAIL: admin@jobgoblin.local
      E2E_ADMIN_PASSWORD: goblin-demo-pass-123
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Configure E2E environment
        run: |
          cat > .env <<EOF
          APP_ENV=development
          APP_SECRET_KEY=ci-e2e-secret-key-change-me
          DATABASE_URL=postgresql+psycopg://jobgoblin:jobgoblin@db:5432/jobgoblin
          AI_PROVIDER=mock
          OLLAMA_BASE_URL=http://ollama:11434
          OLLAMA_MODEL=qwen2.5:7b-instruct
          OLLAMA_FAST_MODEL=llama3.2:3b
          FILE_STORAGE_PATH=/data/uploads
          MAX_UPLOAD_MB=10
          ADMIN_EMAIL=${E2E_ADMIN_EMAIL}
          ADMIN_PASSWORD=${E2E_ADMIN_PASSWORD}
          FRONTEND_ORIGIN=http://localhost:3000
          GOOGLE_CLIENT_ID=
          GOOGLE_CLIENT_SECRET=
          OAUTH_REDIRECT_BASE_URL=http://localhost:8080
          ALLOWED_EMAILS=
          TOTP_ISSUER=JobGoblin
          CLOUDFLARED_TUNNEL_TOKEN=
          EOF

      - name: Start Docker Compose stack
        run: |
          # CI uses the mock AI provider, so do not start the large Ollama image.
          docker compose up -d db
          for attempt in {1..30}; do
            if docker compose exec -T db pg_isready -U jobgoblin -d jobgoblin; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose logs --no-color db
              exit 1
            fi
            sleep 2
          done
          docker compose up -d --build --no-deps backend frontend caddy

      - name: Wait for Caddy health route
        run: |
          for _ in {1..60}; do
            if curl --fail --silent --show-error "${PLAYWRIGHT_BASE_URL}/api/health"; then
              exit 0
            fi
            docker compose ps
            sleep 5
          done
          docker compose logs --no-color backend frontend caddy
          exit 1

      - name: Run Playwright E2E
        working-directory: frontend
        run: npx playwright test

      - name: Collect Docker Compose diagnostics
        if: failure()
        run: |
          mkdir -p test/e2e-artifacts
          docker compose ps > test/e2e-artifacts/docker-compose-ps.txt
          docker compose logs --no-color > test/e2e-artifacts/docker-compose.log

      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-artifacts
          if-no-files-found: ignore
          path: |
            frontend/playwright-report/
            frontend/test-results/
            test/e2e-artifacts/

      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  publish:
    name: Publish ${{ matrix.service }} image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: e2e
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: backend
            context: ./backend
          - service: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/jobgoblin-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=main
            type=raw,value=sha-${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  publish-summary:
    name: Publish summary
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Write image summary
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "## Published container images"
            echo
            echo "- \`ghcr.io/${owner}/jobgoblin-backend:sha-${GITHUB_SHA}\`"
            echo "- \`ghcr.io/${owner}/jobgoblin-frontend:sha-${GITHUB_SHA}\`"
            echo
            echo "Both images also carry the mutable \`main\` tag."
          } >> "$GITHUB_STEP_SUMMARY"
